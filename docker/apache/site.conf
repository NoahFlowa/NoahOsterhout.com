ServerName localhost
ServerTokens Prod
ServerSignature Off

# Traefik terminates TLS and forwards the original Host without :3000.
# Do not rebuild redirects from the port Apache is listening on.
UseCanonicalName Off
UseCanonicalPhysicalPort Off
DirectorySlash Off

# Self-referential redirects (mod_dir trailing slashes, and anything that
# still used the internal listener) must not advertise http or port 3000.
Header always edit Location "^http://" "https://"
Header always edit Location ":3000" ""

Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Frame-Options "DENY"
